services:

  postgres:
    image: postgres:18
    container_name: taskflow-postgres

    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123

    ports:
      - "5432:5432"

    volumes:
      - taskflow_postgres_data:/var/lib/postgresql

volumes:
  taskflow_postgres_data:
